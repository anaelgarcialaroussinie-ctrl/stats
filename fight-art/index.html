<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fight Art Performance</title>
<meta name="description" content="Préparation, nutrition et Fight IQ des fighters du club FIGHT ART.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fight Art">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/archivo.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
<script>
  // Filet de sécurité : si l'appli ne démarre pas (mise à jour incomplète), on propose de la recharger proprement.
  setTimeout(function () {
    if (window.FAP_BOOTED) return;
    var app = document.getElementById("app");
    app.innerHTML = '<div style="padding:40px 20px;text-align:center"><p style="font-size:18px;font-weight:700">L\'appli se met à jour</p><p style="color:#9A9C96">Touche le bouton pour terminer la mise à jour. Tes données ne sont pas effacées.</p><button id="fap-fix" style="margin-top:16px;padding:14px 22px;border-radius:999px;border:0;background:#B8F34B;font-weight:700;font-size:16px">Recharger l\'appli</button></div>';
    document.getElementById("fap-fix").onclick = function () {
      var done = function () { location.replace(location.pathname + "?v=" + Date.now()); };
      Promise.all([
        navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : null,
        window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null,
      ]).then(done, done);
    };
  }, 6000);
</script>
</body>
</html>
