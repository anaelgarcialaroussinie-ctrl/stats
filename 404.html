<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#15183A">

<style>
html,body{height:100%}
body{margin:0;background:#F2F4FA;color:#15183A;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;text-align:center;padding:24px}
@media (prefers-color-scheme:dark){body{background:#0F1128;color:#ECEEFA}}
.sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(128,128,160,.3);border-top-color:#B9F650;animation:t .8s linear infinite;margin:0 auto 14px}
@keyframes t{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation:none}}
button{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid currentColor;background:none;color:inherit;cursor:pointer;margin-top:14px}
code{font-size:.8rem;opacity:.7;word-break:break-all}
</style>
</head>
<body>
<div id="boot"><div class="sp"></div><p>Chargement de l'application…</p></div>
<script>
(function(){
var BASE="https://mtxhuocwxvzntaomgvny.supabase.co";
var KEY="sb_publishable_4sroySYTlDwVI2qhQnUeMw_Bp1j_aKh";

/* Navigation par outil : la fiche d'un compte est decoupee en cinq sections
   au lieu d'un seul long defilement. Injecte ici pour rester maitrisable par git. */
var EXTRA_CSS = [
".secnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.10)}",
".secnav button{flex:0 0 auto;font-size:.92rem;padding:9px 15px}",
"@media (min-width:980px){.secnav{flex-wrap:wrap;justify-content:center}}",
""].join("\n");

var EXTRA_JS = [
'const SECTIONS=[["resume","Resume"],["conseil","Conseiller"],["plan","Quand publier"],["contenu","Ce qui marche"],["ia","IA et viralite"],["videos","Videos"]];',
'const SECLABEL={resume:"R\\u00e9sum\\u00e9",conseil:"Conseiller",plan:"Quand publier",contenu:"Ce qui marche",ia:"IA et viralit\\u00e9",videos:"Vid\\u00e9os"};',
'let SEC="resume";',
'function sectionOf(el){',
'var t=(el.textContent||"").slice(0,320);',
'if(el.classList.contains("kpis"))return "resume";',
'if(/Sant\\u00e9 du compte/.test(t))return "resume";',
'if(/sur ton t\\u00e9l\\u00e9phone|cran d.accueil/.test(t))return "resume";',
'if(/Ton plan de publication/.test(t))return "plan";',
'if(/Meilleur cr\\u00e9neau|Quand publier/.test(t))return "plan";',
'if(/volution/.test(t))return "plan";',
'if(/Hashtags qui performent/.test(t))return "contenu";',
'if(/Top 5/.test(t))return "contenu";',
'if(el.classList.contains("dims"))return "contenu";',
'if(/Discipline du compte/.test(t))return "ia";',
'if(/Comparaison avec la niche/.test(t))return "ia";',
'if(/Devenir viral/.test(t))return "ia";',
'if(/G\\u00e9n\\u00e9rateur de textes/.test(t))return "ia";',
'if(/Rapport et plan/.test(t))return "ia";',
'if(/Toutes les vid\\u00e9os/.test(t))return "videos";',
'return null;}',
'var ADVMSGS=[];',
'function advEsc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}',
'function advRender(){',
'var log=document.getElementById("advLog");if(!log)return;',
'if(!ADVMSGS.length){log.innerHTML=\'<p class="small muted">Pose ta question. Le conseiller voit les chiffres de ce compte : ses cr\\u00e9neaux, ses dur\\u00e9es, sa port\\u00e9e, ses meilleures et moins bonnes vid\\u00e9os.</p>\';return}',
'log.innerHTML=ADVMSGS.map(function(m){',
'var moi=m.role==="user";',
'return \'<div style="margin:12px 0;\'+(moi?"text-align:right":"")+\'">\'+',
'\'<div style="display:inline-block;max-width:92%;text-align:left;padding:10px 13px;border-radius:14px;\'+',
'(moi?"background:var(--pink);color:#fff":"background:var(--cell)")+\'">\'+',
'(moi?\'<div style="white-space:pre-wrap">\'+advEsc(m.content)+\'</div>\':mdToHtml(m.content))+',
'\'</div></div>\'}).join("");',
'log.scrollTop=log.scrollHeight;}',
'async function advSend(q){',
'var ta=document.getElementById("advInput"),btn=document.getElementById("advSend");',
'q=(q||(ta?ta.value:"")).trim();if(!q)return;',
'if(ta)ta.value="";',
'ADVMSGS.push({role:"user",content:q});advRender();',
'if(btn){btn.disabled=true;btn.textContent="\\u2026"}',
'var log=document.getElementById("advLog");',
'if(log){log.insertAdjacentHTML("beforeend",\'<p class="small muted" id="advWait">Le conseiller r\\u00e9fl\\u00e9chit\\u2026</p>\');log.scrollTop=log.scrollHeight}',
'try{',
'var r=await fetch(API.replace(/\\/api$/,"/chat"),{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(MODE==="me"?getCTok():getTok())},',
'body:JSON.stringify({client_id:CUR.client.id,messages:ADVMSGS})});',
'var d=await r.json().catch(function(){return{}});',
'if(!r.ok)throw new Error(d.error||("Erreur "+r.status));',
'ADVMSGS.push({role:"assistant",content:d.reply});advRender();',
'}catch(e){',
'var w=document.getElementById("advWait");',
'if(w)w.outerHTML=\'<p class="small" style="color:var(--bad)">\'+advEsc(e.message)+\'</p>\';',
'}finally{if(btn){btn.disabled=false;btn.textContent="Envoyer"}}}',
'function buildAdvisor(){',
'var d=document.createElement("div");',
'd.className="panel stack";',
'var sug=["Par quoi je commence cette semaine ?","Mon compte est-il brid\\u00e9 ?","Quel format je dois arr\\u00eater ?","Comment viser la mon\\u00e9tisation ?"];',
'd.innerHTML=\'<div><h2 style="font-size:1.3rem">Conseiller strat\\u00e9gie</h2>\'+',
'\'<p class="small muted" style="margin:.2rem 0 0">Expert r\\u00e9seaux sociaux, algorithmes et statistiques. Il a les chiffres de ce compte sous les yeux.</p></div>\'+',
'\'<div id="advLog" class="report" style="max-height:58vh;overflow-y:auto;padding-right:4px"></div>\'+',
'\'<div class="row">\'+sug.map(function(x){return \'<button class="chip" data-sug="\'+advEsc(x)+\'">\'+x+\'</button>\'}).join("")+\'</div>\'+',
'\'<textarea id="advInput" rows="2" placeholder="Ta question\\u2026" style="border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;width:100%;font:inherit;color:inherit"></textarea>\'+',
'\'<div class="row"><button class="btn primary" id="advSend">Envoyer</button><button class="btn" id="advClear">Effacer</button></div>\';',
'setTimeout(function(){',
'advRender();',
'var b=d.querySelector("#advSend");if(b)b.onclick=function(){advSend()};',
'var c=d.querySelector("#advClear");if(c)c.onclick=function(){ADVMSGS=[];advRender()};',
'd.querySelectorAll("[data-sug]").forEach(function(x){x.onclick=function(){advSend(x.dataset.sug)}});',
'var t=d.querySelector("#advInput");',
'if(t)t.onkeydown=function(e){if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();advSend()}};',
'},0);',
'return d;}',
'function installSections(){',
'var wrap=document.querySelector("#view > .stack")||document.querySelector(".wrap > .stack");',
'if(!wrap)return;',
'var kids=Array.prototype.slice.call(wrap.children);',
'if(kids.length<6)return;',
'if(wrap.querySelector(".secnav"))return;',
'var map=kids.map(function(el,i){return i<3?null:sectionOf(el)});',
'if(map.filter(function(s){return s}).length<3)return;',
'var nav=document.createElement("nav");',
'nav.className="tabs secnav";nav.setAttribute("role","tablist");',
'nav.innerHTML=SECTIONS.map(function(p){return \'<button role="tab" data-sec="\'+p[0]+\'">\'+SECLABEL[p[0]]+\'</button>\'}).join("");',
'var adv=buildAdvisor();wrap.appendChild(adv);kids.push(adv);map.push("conseil");',
'wrap.insertBefore(nav,kids[3]);',
'function apply(){',
'kids.forEach(function(el,i){var s=map[i];if(s)el.style.display=(s===SEC)?"":"none"});',
'nav.querySelectorAll("[data-sec]").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.sec===SEC))});}',
'nav.querySelectorAll("[data-sec]").forEach(function(b){b.onclick=function(){SEC=b.dataset.sec;apply();window.scrollTo({top:0,behavior:"smooth"})}});',
'apply();}',
''].join("\n");

function patch(html){
  var n=0;
  /* La cle IA accepte desormais Anthropic ou Google Gemini, dont l'offre gratuite suffit. */
  html=html.split("Rapports IA (optionnel)").join("Rapports et textes IA");
  html=html.split("Cr\u00e9e une cl\u00e9 sur").join("Gratuit avec Google Gemini : cr\u00e9e une cl\u00e9 sur <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a> (sans carte bancaire). Sinon, cl\u00e9 payante sur");
  html=html.split("Cl\u00e9 API Anthropic").join("Cl\u00e9 API (Google Gemini ou Anthropic)");
  html=html.split('placeholder="sk-ant-\u2026"').join('placeholder="AIza\u2026 ou sk-ant-\u2026"');
  html=html.split("ajoute une cl\u00e9 API Anthropic dans R\u00e9glages").join("ajoute une cl\u00e9 API gratuite Google Gemini dans R\u00e9glages");
  html=html.split("Ajoute d'abord ta cl\u00e9 API Anthropic").join("Ajoute d'abord une cl\u00e9 API dans R\u00e9glages");
  if(html.indexOf(".notice{border-left")>=0){html=html.replace(".notice{border-left",EXTRA_CSS+".notice{border-left");n++}
  if(html.indexOf('let CUR=null, metric="views";')>=0){html=html.replace('let CUR=null, metric="views";',EXTRA_JS+'let CUR=null, metric="views";');n++}
  if(html.indexOf("bindPage();bindClient();bindInstall();")>=0){
    html=html.split("bindPage();bindClient();bindInstall();").join("bindPage();bindClient();bindInstall();try{installSections()}catch(e){}");n++}
  return n===3?html:html;
}
function fail(m){
  document.getElementById("boot").innerHTML=
   '<p><strong>L’application n’a pas pu se charger.</strong></p><p><code>'+String(m).replace(/</g,"&lt;")+'</code></p>'+
   '<button onclick="location.reload()">Réessayer</button>';
}
fetch(BASE+"/rest/v1/site_public?select=html&id=eq.1",{headers:{apikey:KEY,Authorization:"Bearer "+KEY,Accept:"application/json"}})
.then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
.then(function(rows){
  var html=rows&&rows[0]&&rows[0].html;
  if(!html)throw new Error("page vide");
  document.open();document.write(patch(html));document.close();
})
.catch(function(e){fail(e.message||e)});
})();
</script>
</body>
</html>
